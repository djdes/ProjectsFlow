<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS Safari игнорирует maximum-scale/user-scalable для accessibility (с iOS 10+) —
         не полагаемся на них. Защита от авто-зума при фокусе в input реализована через
         font-size: 16px на input/textarea в @media (max-width: 639px) в globals.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ProjectsFlow</title>

    <!-- PWA: Home Screen install + service worker (public/sw.js, registered by main.tsx).
         pf-app-shell marks the app shell: only such a response is kept by the service worker
         for offline start (the landing page and other pages never get cached as the shell). -->
    <meta name="pf-app-shell" content="1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="application-name" content="ProjectsFlow" />
    <meta name="apple-mobile-web-app-title" content="ProjectsFlow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16171b" media="(prefers-color-scheme: dark)" />
    <script>
      // FOUC fix: применяем тему ДО React, чтобы не мерцать светлым на загрузке тёмной.
      (function () {
        try {
          var t = localStorage.getItem('pf-theme') || 'system';
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
          // Status bar follows the chosen theme (ThemeProvider keeps it in sync later).
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute('content', dark ? '#16171b' : '#ffffff');
            metas[i].removeAttribute('media');
          }
        } catch (_) {
          /* localStorage недоступен — ничего страшного, останется light */
        }
      })();
      // То же для анимаций — иначе первый кадр диалога/меню успеет анимироваться
      // до монтирования MotionProvider.
      (function () {
        try {
          var m = localStorage.getItem('pf-motion');
          // Defaults on, including touch devices; respect explicit and system opt-out.
          var off = m === 'off' || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (off) document.documentElement.classList.add('pf-no-motion');
        } catch (_) {
          /* localStorage недоступен */
        }
      })();
      (function () {
        // Sidebar width of the boot skeleton (pf-loading-shell), the same as AppShell's.
        try {
          var stored = Number(localStorage.getItem('pf_sidebar_width')) || 270;
          var width = localStorage.getItem('pf_sidebar_collapsed') === '1' ? 0 : Math.min(480, Math.max(176, stored));
          document.documentElement.style.setProperty('--pf-boot-sidebar', width + 'px');
        } catch (_) { /* Use the default sidebar geometry. */ }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="pf-boot" role="status" aria-label="Загружаем ProjectsFlow…" aria-busy="true"></div>
    </div>
    <!-- Prerendered skeletons + the script that picks one by URL (vite.config.ts). -->
    <!--pf-boot-skeleton-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
